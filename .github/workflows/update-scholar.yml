# Updates data/scholar.json from Google Scholar every day.
# The website reads that file to show live citations, h-index and per-paper citation counts.
# To run it immediately: Actions tab -> "Update Google Scholar data" -> Run workflow.

name: Update Google Scholar data

on:
  schedule:
    - cron: "17 1 * * *"    # every day at 06:17 Pakistan time
  workflow_dispatch:         # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Google Scholar profile
        env:
          SCHOLAR_ID: uxLhFRUAAAAJ
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, os, re, sys, html, time, urllib.request, datetime

          sid = os.environ["SCHOLAR_ID"]
          url = f"https://scholar.google.com/citations?user={sid}&hl=en&cstart=0&pagesize=100&sortby=pubdate"
          agents = [
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
              "Mozilla/5.0 (Macintosh; Intel Mac OS X 13_5) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15",
          ]
          page = ""
          for attempt, ua in enumerate(agents * 2):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": ua, "Accept-Language": "en-US,en;q=0.9"})
                  page = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
                  if "gsc_rsb_std" in page:
                      break
              except Exception as e:
                  print("Attempt", attempt + 1, "failed:", e)
              time.sleep(20)

          if "gsc_rsb_std" not in page:
              print("::warning::Google Scholar did not return the profile today. The website keeps the previous numbers.")
              sys.exit(0)

          def clean(s):
              return html.unescape(re.sub(r"<[^>]+>", "", s or "")).strip()

          nums = [int(n) for n in re.findall(r'<td class="gsc_rsb_std">(\d+)</td>', page)]
          since = (re.search(r"Since (\d{4})", page) or [None, ""])[1]
          papers = []
          for row in page.split('<tr class="gsc_a_tr">')[1:]:
              t = re.search(r'class="gsc_a_at"[^>]*>(.*?)</a>', row, re.S)
              if not t:
                  continue
              grays = re.findall(r'<div class="gs_gray">(.*?)</div>', row, re.S)
              c = re.search(r'class="gsc_a_ac[^"]*"[^>]*>(\d*)</a>', row)
              y = re.search(r'class="gsc_a_h gsc_a_hc[^"]*">(\d{4})?</span>', row)
              papers.append({
                  "title": clean(t.group(1)),
                  "authors": clean(grays[0]) if grays else "",
                  "venue": clean(grays[1]) if len(grays) > 1 else "",
                  "year": (y.group(1) or "") if y else "",
                  "citations": int(c.group(1)) if c and c.group(1) else 0,
              })

          if len(nums) < 6:
              print("::warning::Unexpected page layout; keeping previous data.")
              sys.exit(0)

          new = {
              "citations": nums[0], "citationsSince": nums[1],
              "hIndex": nums[2], "hIndexSince": nums[3],
              "i10Index": nums[4], "i10IndexSince": nums[5],
              "since": since, "papers": papers,
          }
          path = "data/scholar.json"
          old = {}
          if os.path.exists(path):
              try:
                  old = json.load(open(path))
              except Exception:
                  old = {}
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          new["updated"] = old.get("updated", today) if {k: old.get(k) for k in new} == new else today
          new["checked"] = today
          json.dump(new, open(path, "w"), ensure_ascii=False, indent=1)
          print(f"Citations {new['citations']}, h-index {new['hIndex']}, i10 {new['i10Index']}, {len(papers)} papers.")
          PY

      - name: Save changes
        run: |
          git config user.name "scholar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scholar.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Google Scholar data"
            git push
          fi
