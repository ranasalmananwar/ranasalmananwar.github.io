<!DOCTYPE html>
<html>
<head>
<base target="_blank">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:"Work Sans",Arial,sans-serif;color:#433d47;background:transparent}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);background:#2b2233;border-top:1px solid #3a2e45}
  .stats div{padding:26px 20px;border-right:1px solid rgba(255,255,255,.14)}
  .stats div:last-child{border-right:0}
  .stats b{display:block;font-family:"Libre Caslon Text",Georgia,serif;font-weight:500;font-size:44px;line-height:1;color:#fff}
  .stats span{display:block;margin-top:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a9b3a8}
  .stats small{display:block;margin-top:4px;font-size:12px;color:#a1aa9f}
  .foot{font-size:12px;color:#736b77;padding:10px 2px}
  .foot a{color:#8a5f12;text-decoration:none}
  ol{list-style:none;margin:0;padding:0;border-top:2px solid #2b2233}
  li{display:grid;grid-template-columns:1fr 90px;gap:16px;padding:16px 0;border-bottom:1px solid #ddd3c6}
  .t{font-family:"Libre Caslon Text",Georgia,serif;font-size:19px;color:#221d26;line-height:1.3}
  .a{font-size:14px;margin-top:2px}
  .v{font-size:14px;font-style:italic}
  .c{text-align:right}
  .c b{display:block;font-family:"Libre Caslon Text",Georgia,serif;font-size:26px;font-weight:500;color:#2b2233;line-height:1}
  .c span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#736b77}
  .y{font-size:13px;color:#736b77}
  @media (max-width:520px){.stats{grid-template-columns:1fr}.stats div{border-right:0;border-bottom:1px solid rgba(255,255,255,.14)}}
</style>
</head>
<body>
<? if (!data) { ?>
  <div class="foot">Scholar data is being prepared. Please check back shortly.</div>
<? } else if (view === 'papers') { ?>
  <ol>
  <? for (var i = 0; i < data.papers.length; i++) { var p = data.papers[i]; ?>
    <li>
      <div><div class="t"><?= p.t ?></div><div class="a"><?= p.a ?></div><div class="v"><?= p.v ?></div><div class="y"><?= p.y ?></div></div>
      <div class="c"><b><?= p.c ?></b><span>Citations</span></div>
    </li>
  <? } ?>
  </ol>
  <div class="foot"><?= data.papers.length ?> publications · Updated daily from <a href="<?= profile ?>">Google Scholar</a> · Last update <?= data.updated ?></div>
<? } else { ?>
  <div class="stats">
    <div><b><?= data.citations ?></b><span>Citations</span><small><?= data.citationsSince ?> since <?= data.since ?></small></div>
    <div><b><?= data.h ?></b><span>h-index</span><small><?= data.hSince ?> since <?= data.since ?></small></div>
    <div><b><?= data.i10 ?></b><span>i10-index</span><small><?= data.i10Since ?> since <?= data.since ?></small></div>
  </div>
  <div class="foot">Live from <a href="<?= profile ?>">Google Scholar</a> · Updated <?= data.updated ?></div>
<? } ?>
</body>
</html>
